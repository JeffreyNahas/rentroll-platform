services:
  db:
    image: postgres:16
    container_name: rri-db
    environment:
      POSTGRES_DB: rentroll
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rentroll"]
      interval: 3s
      timeout: 3s
      retries: 15

  adminer:
    image: adminer
    container_name: rri-adminer
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata: